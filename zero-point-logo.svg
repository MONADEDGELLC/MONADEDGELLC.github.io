<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Zero-Point Logo</title>
  <!-- Top funnel: outline only. Sides flare out like the gap between two touching spheres -->
  <path d="M100,150 L300,150 C220,170 200,235 200,290 C200,235 180,170 100,150 Z"
        fill="none" stroke="#000" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Bottom funnel: solid black. Zero-point gap sits between y=290 and y=310 -->
  <path d="M100,450 L300,450 C220,430 200,365 200,310 C200,365 180,430 100,450 Z"
        fill="#000" stroke="#000" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
