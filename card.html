<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>MONAD EDGE LLC | Jesse DeWayne McCready</title>
<style>
:root{--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
 --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(ellipse at 50% 42%,#0b0d10 0,#000 62%) fixed,#000;color:#eee;font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
 min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px 90px}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
 background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:72px 72px;background-position:center;
 -webkit-mask-image:radial-gradient(ellipse at 50% 42%,#000 0,transparent 68%);mask-image:radial-gradient(ellipse at 50% 42%,#000 0,transparent 68%)}
.floor{position:fixed;left:0;right:0;bottom:0;height:46vh;overflow:hidden;perspective:380px;z-index:-1;pointer-events:none;
 -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 75%);mask-image:linear-gradient(to bottom,transparent 0,#000 75%)}
.floor::before{content:"";position:absolute;left:-70%;right:-70%;top:0;height:260%;transform-origin:50% 0;transform:rotateX(72deg);
 background-image:linear-gradient(rgba(255,255,255,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px);background-size:64px 64px;animation:drift 5s linear infinite}
@keyframes drift{to{background-position:0 64px}}
.stage{width:min(560px,100%);perspective:1200px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.stage.drag{cursor:grabbing}
.card{position:relative;width:100%;aspect-ratio:7/4;transform-style:preserve-3d;will-change:transform;--mx:50%;--my:30%}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;container-type:inline-size}
.paper{color:#1a1916;
 background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .3 0 0 0 0 .2 0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
 linear-gradient(135deg,#f4efe1,#e9e2cf 55%,#efe9d8)}
.front{transform:translateZ(2.5px)}
.paper::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.55),transparent 55%)}
.wm{position:absolute;left:50%;top:50%;width:46%;transform:translate(-50%,-50%);color:#3b352a;opacity:.055}
.txt{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;font-family:var(--serif);padding:7cqw 6cqw 6cqw}
.raise{text-shadow:-.5px -.5px 0 rgba(255,255,255,.85),.6px .9px 0 rgba(0,0,0,.30),.4px 1.2px 1.6px rgba(0,0,0,.22)}
.co{font-size:1.1rem;font-size:clamp(.62rem,2.7cqw,.95rem);letter-spacing:.34em;text-transform:uppercase;font-weight:600}
.nm{font-size:1.9rem;font-size:clamp(1.15rem,7.4cqw,2.5rem);font-weight:600;letter-spacing:.01em;line-height:1.1}
.ti{margin-top:.5em;font-size:.95rem;font-size:clamp(.68rem,3.1cqw,1.05rem);font-style:italic;letter-spacing:.04em}
.mid{display:flex;flex-direction:column;align-items:center}
.rule{width:14cqw;height:1px;background:#1a1916;opacity:.55;margin:3.2cqw 0}
.lo{font-size:.7rem;font-size:clamp(.54rem,2.5cqw,.86rem);line-height:1.65;letter-spacing:.05em}
.lo a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(26,25,22,.35)}
.lo a:hover,.lo a:focus-visible{border-bottom-color:#1a1916;outline:0}
.lo .id{font-size:.82em;letter-spacing:.14em;margin-top:.3em;opacity:.8}
.back{transform:rotateY(180deg) translateZ(2.5px)}
.back::after{background:radial-gradient(circle at calc(100% - var(--mx)) var(--my),rgba(255,255,255,.55),transparent 55%)}
.bk{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:space-between;gap:5cqw;padding:6cqw 7cqw}
.bk svg{width:19cqw;height:auto;flex:none;color:#1a1916;opacity:.92;filter:drop-shadow(-.5px -.5px 0 rgba(255,255,255,.85)) drop-shadow(.6px .9px 0 rgba(0,0,0,.30))}
.acts{display:grid;gap:2.2cqw;flex:1;max-width:60%}
.act{display:flex;justify-content:space-between;align-items:center;padding:2.6cqw 3.2cqw;border:1px solid rgba(26,25,22,.55);color:#1a1916;text-decoration:none;font:600 .8rem var(--serif);font-size:clamp(.66rem,2.9cqw,.95rem);letter-spacing:.04em;background:rgba(255,255,255,.22);cursor:pointer;transition:.2s;text-shadow:-.5px -.5px 0 rgba(255,255,255,.85),.6px .9px 0 rgba(0,0,0,.25)}
.act:hover,.act:focus-visible{background:#1a1916;color:#f4efe1;border-color:#1a1916;text-shadow:none;outline:0}
.act i{font:normal .8em var(--mono);opacity:.7}
.e{position:absolute;background:linear-gradient(90deg,#f6f1e3,#cfc7b1)}
.e.l{left:0;top:0;bottom:0;width:5px;transform-origin:0 50%;transform:translateZ(2.5px) rotateY(90deg)}
.e.r{right:0;top:0;bottom:0;width:5px;transform-origin:100% 50%;transform:translateZ(2.5px) rotateY(-90deg)}
.e.t{left:0;right:0;top:0;height:5px;transform-origin:50% 0;transform:translateZ(2.5px) rotateX(-90deg)}
.e.b{left:0;right:0;bottom:0;height:5px;transform-origin:50% 100%;transform:translateZ(2.5px) rotateX(90deg);background:linear-gradient(180deg,#cfc7b1,#a9a28e)}
.pill{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);font:10px var(--mono);letter-spacing:.2em;text-transform:uppercase;
 color:#6f7781;background:transparent;border:1px solid rgba(255,255,255,.14);padding:.7rem 1.2rem;pointer-events:none;transition:color .3s,border-color .3s,background .3s}
.pill.on{color:#f5f6f7;border-color:rgba(255,255,255,.55);background:rgba(0,0,0,.6);pointer-events:auto;cursor:pointer}
@media(prefers-reduced-motion:reduce){.floor::before{animation:none}}
</style>
</head>
<body>
<div class="floor" aria-hidden="true"></div>
<div class="stage" id="stage">
 <div class="card" id="card">
  <div class="face paper front">
   <svg class="wm" viewBox="94 144 212 312" aria-hidden="true"><path d="M100,150 L300,150 C220,170 200,235 200,290 C200,235 180,170 100,150 Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/><path d="M100,450 L300,450 C220,430 200,365 200,310 C200,365 180,430 100,450 Z" fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/></svg>
   <div class="txt">
    <div class="co raise">Monad Edge LLC</div>
    <div class="mid">
     <div class="nm raise">Jesse DeWayne McCready</div>
     <div class="ti raise">Principal Architect / CEO</div>
     <div class="rule"></div>
    </div>
    <div class="lo raise">
     <div>Shreveport, Louisiana</div>
     <div><a href="mailto:monadedgellc@gmail.com">monadedgellc@gmail.com</a> &middot; <a href="https://monadedgellc.space">monadedgellc.space</a></div>
     <div class="id">CAGE 243J6 &middot; UEI YE9ZHNXRY2N8</div>
    </div>
   </div>
  </div>
  <div class="face paper back">
   <div class="bk">
    <svg viewBox="94 144 212 312" role="img" aria-label="Monad Edge logo"><path d="M100,150 L300,150 C220,170 200,235 200,290 C200,235 180,170 100,150 Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M100,450 L300,450 C220,430 200,365 200,310 C200,365 180,430 100,450 Z" fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <nav class="acts">
     <a class="act" id="vc" href="#" role="button">Save contact <i>.vcf</i></a>
     <a class="act" href="https://www.linkedin.com/in/jesse-mccready-893b52245/" target="_blank" rel="noopener noreferrer">LinkedIn <i>&rarr;</i></a>
     <a class="act" href="https://github.com/MONADEDGELLC" target="_blank" rel="noopener noreferrer">GitHub <i>&rarr;</i></a>
    </nav>
   </div>
  </div>
  <i class="e l"></i><i class="e r"></i><i class="e t"></i><i class="e b"></i>
 </div>
</div>
<button class="pill" id="pill" type="button">Drag to rotate</button>
<script>
(function(){
  /* contact file */
  document.getElementById('vc').addEventListener('click',function(e){
    e.preventDefault();
    var v=['BEGIN:VCARD','VERSION:3.0','N:McCready;Jesse DeWayne;;;','FN:Jesse DeWayne McCready','ORG:MONAD EDGE LLC','TITLE:Principal Architect / CEO',
      'EMAIL;TYPE=WORK:monadedgellc@gmail.com','URL:https://monadedgellc.space','ADR;TYPE=WORK:;;;Shreveport;LA;;USA','END:VCARD'].join('\r\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([v],{type:'text/vcard'}));a.download='jesse-mccready.vcf';
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
  });
  var card=document.getElementById('card'),stage=document.getElementById('stage'),pill=document.getElementById('pill');
  var D=Math.PI/180;
  /* spin, stabilize, and auto-return */
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var rx=0,ry=0,vx=0,vy=0,hx=0,hy=0,mode='stable',drag=false,moved=false,lx=0,ly=0,lastIn=performance.now();
  function stabilize(){mode='stab';vx=vy=0;}
  function onCtl(t){return t&&t.closest&&t.closest('a,button');}
  stage.addEventListener('pointerdown',function(e){if(onCtl(e.target))return;lastIn=performance.now();drag=true;moved=false;lx=e.clientX;ly=e.clientY;});
  stage.addEventListener('pointermove',function(){lastIn=performance.now();},{passive:true});
  stage.addEventListener('touchstart',function(){lastIn=performance.now();},{passive:true});
  addEventListener('pointermove',function(e){
    if(drag){var dx=e.clientX-lx,dy=e.clientY-ly;if(!moved&&Math.abs(dx)+Math.abs(dy)<4)return;
      moved=true;lastIn=performance.now();mode='free';stage.classList.add('drag');
      vy=Math.max(-40,Math.min(40,dx*.5));vx=Math.max(-40,Math.min(40,-dy*.5));ry+=vy;rx+=vx;lx=e.clientX;ly=e.clientY;
    }else if(mode==='stable'&&e.pointerType==='mouse'&&!reduce){hy=(e.clientX/innerWidth-.5)*14;hx=(.5-e.clientY/innerHeight)*10;}
  },{passive:true});
  function up(){if(drag){drag=false;stage.classList.remove('drag');}}
  addEventListener('pointerup',up);addEventListener('pointercancel',up);
  stage.addEventListener('dblclick',function(e){if(!onCtl(e.target))stabilize();});
  pill.addEventListener('click',stabilize);
  addEventListener('keydown',function(e){if(e.key==='Escape'||e.key==='s'||e.key==='S')stabilize();});
  function frame(){
    var czz=Math.cos(rx*D)*Math.cos(ry*D);if(mode==='free'&&!drag&&performance.now()-lastIn>(czz<-.6?30000:4000))stabilize();
    if(!drag){
      if(mode==='free'){ry+=vy;rx+=vx;vy*=.972;vx*=.972;if(Math.abs(vy)<.03&&Math.abs(vx)<.03){vy=vx=0;}else{lastIn=performance.now();}}
      else if(mode==='stab'){var ty=Math.round(ry/360)*360,tx=Math.round(rx/360)*360;ry+=(ty-ry)*.12;rx+=(tx-rx)*.12;
        if(Math.abs(ty-ry)+Math.abs(tx-rx)<.1){ry=rx=0;mode='stable';}}
      else{ry+=(hy-ry)*.08;rx+=(hx-rx)*.08;}
    }
    card.style.transform='rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg)';
    card.style.setProperty('--mx',(50+40*Math.sin(ry*D)).toFixed(1)+'%');card.style.setProperty('--my',(50-40*Math.sin(rx*D)).toFixed(1)+'%');
    var on=mode!=='stable';
    if(on!==pill.classList.contains('on')){pill.classList.toggle('on',on);pill.textContent=on?'Stabilize':'Drag to rotate';}
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
